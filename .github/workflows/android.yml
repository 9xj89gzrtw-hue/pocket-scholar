name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build llama.cpp for Android
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "NDK=$NDK"
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp /tmp/llama
          for abi in x86_64 arm64-v8a; do
            cmake -S /tmp/llama -B "/tmp/llama/build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLAMA_CURL=OFF \
              -DGGML_OPENMP=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "/tmp/llama/build-$abi" --target llama-cli -j"$(nproc)"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "/tmp/llama/build-$abi/bin/llama-cli" "app/src/main/jniLibs/$abi/libllama-cli.so"
            file "app/src/main/jniLibs/$abi/libllama-cli.so"
          done

      - name: Assemble APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: model.gguf
          key: qwen2.5-1.5b-instruct-q4_k_m-v1

      - name: Fetch model
        run: |
          test -f model.gguf || curl -L --fail --retry 3 \
            -o model.gguf \
            "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
          ls -lh model.gguf

      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "NO /dev/kvm"
          sudo chmod 666 /dev/kvm || true

      - name: Install and record the demo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot
          script: |
            set -eux
            adb install -r app-debug.apk

            # Evidence that the app cannot reach the network: no INTERNET permission.
            adb shell dumpsys package org.pocketscholar > dumpsys.txt
            if grep -q "android.permission.INTERNET" dumpsys.txt; then
              echo "INTERNET permission present -- FAIL"; exit 1
            fi
            echo "no INTERNET permission" > permissions.txt

            adb shell "mkdir -p /sdcard/Android/data/org.pocketscholar/files"
            adb push model.gguf /sdcard/Android/data/org.pocketscholar/files/model.gguf
            adb shell am start -n org.pocketscholar/.MainActivity
            sleep 25
            adb exec-out screencap -p > 01-home.png

            adb shell screenrecord --time-limit 130 --bit-rate 4000000 /sdcard/demo1.mp4 &
            sleep 2
            adb shell am start -n org.pocketscholar/.MainActivity \
              --es query "Why did the Great Depression spread beyond the United States?" --ez autorun true
            sleep 120
            adb pull /sdcard/demo1.mp4 demo1.mp4 || true
            adb exec-out screencap -p > 02-answer-depression.png

            adb shell screenrecord --time-limit 130 --bit-rate 4000000 /sdcard/demo2.mp4 &
            sleep 2
            adb shell am start -n org.pocketscholar/.MainActivity \
              --es query "Why did the Roman Empire fall?" --ez autorun true
            sleep 120
            adb pull /sdcard/demo2.mp4 demo2.mp4 || true
            adb exec-out screencap -p > 03-answer-rome.png

            adb logcat -d -s PocketScholar:* llama-cli:* > logcat.txt || true
            ls -lh *.png *.mp4 *.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: |
            *.png
            *.mp4
            permissions.txt
            logcat.txt
